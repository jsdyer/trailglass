name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * 2'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore dated municipal data extracts
        uses: actions/cache@v4
        with:
          path: .cache
          key: trailglass-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trailglass-data-
      - uses: actions/configure-pages@v5
      - name: Build the static application
        run: |
          if test -f requirements.txt; then
            python3 -m venv "$RUNNER_TEMP/app-venv"
            . "$RUNNER_TEMP/app-venv/bin/activate"
            python3 -m pip install -r requirements.txt
          fi
          python3 scripts/build.py
          test -s dist/index.html
      - name: Check route geometry, municipal downloads and local GPX imports
        run: |
          node --test tests/*.test.mjs
          python3 -m venv "$RUNNER_TEMP/browser-check"
          . "$RUNNER_TEMP/browser-check/bin/activate"
          pip install playwright==1.58.0
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_PATH"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist &
          python3 tests/browser_smoke.py http://127.0.0.1:8000/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
